server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Force https when a proxy in front of us says the client arrived over http.
    #
    # The Speaking section cannot work on an insecure origin: getUserMedia is gated on a secure
    # context, so on http:// the browser does not prompt for the microphone -- it removes
    # navigator.mediaDevices entirely, and no browser setting the candidate can reach will bring
    # it back. localhost is exempt, which is why this never shows up in local testing and only
    # ever bites in production.
    #
    # The test is deliberately narrow. This container listens on plain 80 because TLS terminates
    # upstream, so redirecting unconditionally would loop forever; it fires only when the proxy
    # explicitly reports the ORIGINAL scheme as http. If your proxy does not set
    # X-Forwarded-Proto this is a no-op and the redirect must be configured there instead.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # The SPA entry must NEVER be cached. It names the hashed chunk files, so a stale copy
    # points at chunks that no longer exist after a deploy: the dynamic import 404s and the
    # app blanks until the user hard-refreshes. Routes are code-split, so this matters.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # SPA fallback — all client-side routes resolve to index.html. try_files re-enters
    # location matching, so the no-store block above applies to these too.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Hashed assets are safe to cache forever — the filename changes when content does.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
