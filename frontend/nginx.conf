server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. Without this the container served 1,040 KB of raw JavaScript on
    # every cold load -- the browser asks for gzip and nginx simply did not answer with it. The
    # asset file names carry a content hash, so a deploy invalidates every cached chunk and each
    # user pays the full download again; that is the "the app is slow after login" complaint.
    #
    # gzip_comp_level 5 rather than the maximum: past 5 the extra CPU per request buys very
    # little on files this size, and this container also serves the audio uploads path.
    # gzip_vary tells any proxy in front of us to key its cache on Accept-Encoding, so a
    # compressed response is never handed to a client that cannot read it.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Force https when a proxy in front of us says the client arrived over http.
    #
    # The Speaking section cannot work on an insecure origin: getUserMedia is gated on a secure
    # context, so on http:// the browser does not prompt for the microphone -- it removes
    # navigator.mediaDevices entirely, and no browser setting the candidate can reach will bring
    # it back. localhost is exempt, which is why this never shows up in local testing and only
    # ever bites in production.
    #
    # The test is deliberately narrow. This container listens on plain 80 because TLS terminates
    # upstream, so redirecting unconditionally would loop forever; it fires only when the proxy
    # explicitly reports the ORIGINAL scheme as http. If your proxy does not set
    # X-Forwarded-Proto this is a no-op and the redirect must be configured there instead.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # The SPA entry must NEVER be cached. It names the hashed chunk files, so a stale copy
    # points at chunks that no longer exist after a deploy: the dynamic import 404s and the
    # app blanks until the user hard-refreshes. Routes are code-split, so this matters.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # SPA fallback — all client-side routes resolve to index.html. try_files re-enters
    # location matching, so the no-store block above applies to these too.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Hashed assets are safe to cache forever — the filename changes when content does.
    # A year rather than 30 days: "immutable" already promises the bytes never change, so the
    # shorter window bought nothing except a revalidation round trip for anyone who came back
    # after a month.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Self-hosted Poppins. These filenames are NOT content-hashed — they are stable by design so
    # the preload links in index.html can name them — but a given file's bytes never change
    # either: a new version of the font would arrive under a new name. Cached for a year so a
    # returning user never re-downloads a typeface, and so the font is never the thing that
    # delays the first paint.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
