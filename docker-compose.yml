services:
  db:
    image: postgres:16-alpine
    container_name: trainer-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainer}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: trainer-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-trainer}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainer}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-long-random-secret-value-at-least-32-chars}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-480}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
      APP_DEV_LOGIN_ENABLED: ${APP_DEV_LOGIN_ENABLED:-false}
      # Root admin list. application.yml and .env.example already expose this, but without
      # this line it never reached the container and the hardcoded default always won.
      APP_SUPER_ADMIN_EMAILS: ${APP_SUPER_ADMIN_EMAILS:-abhinav.surattu@cloudfuze.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # gpt-4o-mini-audio-preview used to be the default here and 404s on our account, so an
      # unset variable silently disabled audio scoring: the call fails, the code falls back to
      # the browser transcript, and nothing surfaces the difference. Verified against the live
      # key with the exact request completeJsonWithAudio sends.
      OPENAI_AUDIO_MODEL: ${OPENAI_AUDIO_MODEL-gpt-audio-mini}
      # Speech-to-text for the speaking section. Unset it and scoring silently falls back to
      # the browser transcript, which is exactly what we moved away from.
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-http://localhost:5173}
        # Hotjar site id, baked in at BUILD time like every VITE_ var. Leave it unset
        # and no tracking script is loaded at all.
        VITE_HOTJAR_SITE_ID: ${VITE_HOTJAR_SITE_ID:-}
        VITE_DEV_LOGIN: ${VITE_DEV_LOGIN:-false}
        VITE_SPEAKING_AUDIO: ${VITE_SPEAKING_AUDIO:-false}
    container_name: trainer-frontend
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  pgdata:
