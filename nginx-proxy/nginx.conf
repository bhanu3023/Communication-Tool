server {
    listen 443 ssl;
    server_name 208.70.248.68;

    # Cert/key are mounted from nginx-proxy/certs/ on the server — not part of this repo.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 50m;

    # Auto-redirect plain HTTP requests hitting this HTTPS port instead of 400ing
    error_page 497 https://$host:9443$request_uri;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Speaking submissions take minutes, not seconds (10 sequential OpenAI calls) —
        # see DEPLOY_NOTES.md section 6.3. Without this, nginx's 60s default 504s the
        # request after the candidate has already finished the exam.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
